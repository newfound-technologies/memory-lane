name: Build and publish release

# Runs whenever code is pushed to main. If the VERSION inside app/photokeeper.py
# has no release yet, it builds the installer and publishes a new release.
on:
  push:
    branches: [main]
    paths: ['app/**', 'installer/**', 'RELEASE_NOTES.md', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          V=$(grep -m1 '^VERSION' app/photokeeper.py | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Already released?
        id: ex
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" >/dev/null 2>&1; then
            if gh release view "v${{ steps.v.outputs.version }}" --json assets -q '.assets[].name' | grep -qx 'Memory-Lane-Setup.exe'; then
              echo "exists=true" >> "$GITHUB_OUTPUT"
            else
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "attach=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install NSIS
        if: steps.ex.outputs.exists == 'false'
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          # Use the main Ubuntu servers (the Azure mirror is sometimes down)
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo rm -f /etc/apt/apt-mirrors.txt
          sudo systemctl stop apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
          for i in 1 2 3; do
            if sudo -E timeout 90 apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o DPkg::Lock::Timeout=30 update \
               && sudo -E timeout 150 apt-get -o Acquire::Retries=2 -o DPkg::Lock::Timeout=30 install -y --no-install-recommends nsis; then
              break
            fi
            echo "apt attempt $i failed, retrying"; sleep 5
          done
          command -v makensis
      - name: Build installer
        if: steps.ex.outputs.exists == 'false'
        run: ./installer/build.sh
      - name: Attach installer to existing release
        if: steps.ex.outputs.exists == 'false' && steps.ex.outputs.attach == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.v.outputs.version }}" installer/Memory-Lane-Setup.exe --clobber
      - name: Publish release
        if: steps.ex.outputs.exists == 'false' && steps.ex.outputs.attach != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" installer/Memory-Lane-Setup.exe \
            --title "Memory Lane ${{ steps.v.outputs.version }}" \
            --notes-file RELEASE_NOTES.md --latest --target "${{ github.sha }}"
